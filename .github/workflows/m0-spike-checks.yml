name: M0 integration spike checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'index.html'
      - 'docs/M0_SPIKE.md'
      - '.github/workflows/m0-spike-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact-version POC dependencies
        run: npm install --no-audit --no-fund
      # Temporary read-only evidence relay: package-lock generated by npm on CI
      # is captured as base64 chunks; next PR commit will pin it and remove this.
      - name: Export temporary dependency-lock evidence
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = fs.readFileSync('package-lock.json').toString('base64');
          console.log('KINOTCH_LOCK_BEGIN');
          for (let i = 0; i < data.length; i += 160) console.log('KINOTCH_LOCK_PART:' + data.slice(i, i + 160));
          console.log('KINOTCH_LOCK_END');
          NODE
      - name: Contract tests
        run: npm test
      - name: Static build (not browser acceptance)
        run: npm run build
      - name: Browser boot smoke in existing runner Chrome
        run: npm run test:browser
