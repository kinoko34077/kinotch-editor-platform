name: M0 integration spike checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'performance.html'
      - 'docs/M0_SPIKE.md'
      - 'scripts/**'
      - 'docs/M0_LICENSE_INVENTORY.md'
      - '.github/workflows/m0-spike-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reproducible locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit locked license metadata (not legal clearance)
        run: npm run check:licenses
      - name: Contract tests
        run: npm test
      - name: Static build (not browser acceptance)
        run: npm run build
      - name: Browser boot smoke in existing runner Chrome
        run: npm run test:browser
      - name: Simulated mobile viewport smoke (not physical Safari)
        run: npm run test:mobile:chrome
      - name: Actual 3000 GrapesJS iframe DOM measured smoke (not device SLA)
        run: npm run test:perf:chrome
